<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>EGU Remote Control</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #0e0e12;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #status-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      background: rgba(20, 20, 30, 0.9);
      backdrop-filter: blur(8px);
      padding: 10px 16px;
      border-radius: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    input, select {
      background: #1e1e2d;
      border: 1px solid #3d3d5c;
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    button {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover {
      background: #4338ca;
    }
    #copy-btn {
      background: #374151;
      display: none;
    }
    #copy-btn:hover {
      background: #4b5563;
    }
    #viewport-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video, img#stream-fallback {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      cursor: crosshair;
    }
  </style>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <div id="status-bar">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span id="status-text">Initializing...</span>
      <button id="copy-btn">Copy ID</button>
    </div>
    <div class="controls">
      <select id="protocol-select">
        <option value="webrtc">WebRTC (Fast P2P)</option>
        <option value="websocket">WebSocket (Fallback)</option>
      </select>
      <input type="text" id="remote-id-input" placeholder="Enter Host Peer ID" />
      <button id="connect-btn">Connect</button>
      <button id="host-btn" style="background: #059669;">Host Screen</button>
    </div>
  </div>

  <div id="viewport-container">
    <video id="display-stream" autoplay playsinline muted></video>
    <img id="stream-fallback" style="display: none;" />
  </div>

  <script>
    const statusText = document.getElementById('status-text');
    const copyBtn = document.getElementById('copy-btn');
    const remoteIdInput = document.getElementById('remote-id-input');
    const connectBtn = document.getElementById('connect-btn');
    const hostBtn = document.getElementById('host-btn');
    const protocolSelect = document.getElementById('protocol-select');
    const displayVideo = document.getElementById('display-stream');
    const streamFallback = document.getElementById('stream-fallback');

    let currentPeerId = '';
    const peer = new Peer();
    let activeDataConn = null;

    // 1. PeerJS Setup
    peer.on('open', (id) => {
      currentPeerId = id;
      statusText.innerText = `My ID: ${id}`;
      copyBtn.style.display = 'inline-block';
    });

    peer.on('error', (err) => {
      console.error('PeerJS Error:', err);
      statusText.innerText = `Error: ${err.type}`;
    });

    // 2. Copy Share ID Button
    copyBtn.addEventListener('click', () => {
      if (!currentPeerId) return;
      navigator.clipboard.writeText(currentPeerId).then(() => {
        const origText = copyBtn.innerText;
        copyBtn.innerText = 'Copied!';
        setTimeout(() => copyBtn.innerText = origText, 2000);
      });
    });

    // 3. User Mode: Connect to Host
    connectBtn.addEventListener('click', () => {
      const mode = protocolSelect.value;

      if (mode === 'webrtc') {
        const hostId = remoteIdInput.value.trim();
        if (!hostId) return alert('Please enter a Host Peer ID');

        statusText.innerText = 'Connecting via WebRTC...';
        activeDataConn = peer.connect(hostId);
        
        activeDataConn.on('open', () => {
          statusText.innerText = 'Connected via WebRTC!';
        });

        peer.on('call', (call) => {
          call.answer();
          call.on('stream', (remoteStream) => {
            displayVideo.style.display = 'block';
            streamFallback.style.display = 'none';
            displayVideo.srcObject = remoteStream;
          });
        });
      } else {
        // WebSocket Fallback Mode
        statusText.innerText = 'Connecting via WebSocket...';
        const wsUrl = `ws://${window.location.hostname || 'localhost'}:3000`;
        const ws = new WebSocket(wsUrl);

        ws.onopen = () => {
          statusText.innerText = 'Connected via WebSocket!';
          window.wsHostControl = ws;
        };

        ws.onmessage = (e) => {
          // Receive JPEG screen frames over WebSocket
          displayVideo.style.display = 'none';
          streamFallback.style.display = 'block';
          streamFallback.src = URL.createObjectURL(new Blob([e.data], { type: 'image/jpeg' }));
        };
      }
    });

    // 4. Relative Coordinates Control Engine
    function sendControlEvent(type, event) {
      const target = displayVideo.style.display !== 'none' ? displayVideo : streamFallback;
      const rect = target.getBoundingClientRect();
      const clientX = event.touches ? event.touches[0].clientX : event.clientX;
      const clientY = event.touches ? event.touches[0].clientY : event.clientY;

      const normX = (clientX - rect.left) / rect.width;
      const normY = (clientY - rect.top) / rect.height;

      if (normX >= 0 && normX <= 1 && normY >= 0 && normY <= 1) {
        const payload = { type, x: normX, y: normY };

        // Send over WebRTC Data Channel or WebSocket depending on active mode
        if (activeDataConn && activeDataConn.open) {
          activeDataConn.send(payload);
        } else if (window.wsHostControl && window.wsHostControl.readyState === WebSocket.OPEN) {
          window.wsHostControl.send(JSON.stringify(payload));
        }
      }
    }

    const interactiveTarget = document.getElementById('viewport-container');
    interactiveTarget.addEventListener('mousedown', (e) => sendControlEvent('click', e));
    interactiveTarget.addEventListener('touchstart', (e) => sendControlEvent('click', e));

    window.addEventListener('keydown', (e) => {
      if (document.activeElement === remoteIdInput) return;
      const payload = { type: 'keydown', key: e.key, code: e.code };

      if (activeDataConn && activeDataConn.open) {
        activeDataConn.send(payload);
      } else if (window.wsHostControl && window.wsHostControl.readyState === WebSocket.OPEN) {
        window.wsHostControl.send(JSON.stringify(payload));
      }
    });

    // 5. Host Mode
    hostBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: { cursor: "always" },
          audio: false
        });

        displayVideo.srcObject = stream;
        statusText.innerText = `Hosting Screen! ID: ${peer.id}`;

        peer.on('connection', (conn) => {
          activeDataConn = conn;
          statusText.innerText = 'Viewer connected!';
          peer.call(conn.peer, stream);

          conn.on('data', (data) => {
            if (window.wsHostControl && window.wsHostControl.readyState === WebSocket.OPEN) {
              window.wsHostControl.send(JSON.stringify(data));
            }
          });
        });
      } catch (err) {
        console.error(err);
        statusText.innerText = 'Screen share cancelled';
      }
    });

    // Connect to local control backend
    try {
      const ws = new WebSocket('ws://localhost:3000');
      ws.onopen = () => console.log('Host controller active');
      window.wsHostControl = ws;
    } catch (e) {}
  </script>
</body>
</html>
